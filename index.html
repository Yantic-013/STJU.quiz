<!DOCTYPE html>
<html lang="zh-CN">
<head>
<script>
  if (localStorage.getItem('quiz_access') !== 'true') {
    document.documentElement.classList.add('access-locked');
  }
</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="刷题助手">
<meta name="theme-color" content="#f8fafc">
<meta name="format-detection" content="telephone=no">
<link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><rect width='180' height='180' rx='36' fill='%234f46e5'/><text x='90' y='115' font-size='100' fill='white' text-anchor='middle' font-family='sans-serif'>📝</text></svg>">
<link rel="manifest" id="manifestLink">
<title>刷题助手</title>
<script src="https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/localforage@1.10.0/dist/localforage.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./styles.css">
</head>
<body>

<div class="access-gate" id="accessGate" role="dialog" aria-modal="true" aria-labelledby="accessGateTitle">
  <form class="access-gate-card" id="accessGateForm">
    <div class="access-gate-mark" aria-hidden="true">Q</div>
    <h1 id="accessGateTitle">进入刷题助手</h1>
    <p>输入访问口令。本设备验证一次后会自动记住。</p>
    <label for="accessPassword">访问口令</label>
    <input class="input" id="accessPassword" type="password" autocomplete="current-password" required>
    <div class="access-gate-error" id="accessGateError" role="alert" aria-live="polite"></div>
    <button class="btn btn-primary" type="submit">进入应用</button>
  </form>
</div>

<!-- 导航栏 -->
<nav class="nav" id="navBar">
  <div class="nav-brand">
    <div class="nav-brand-icon">✈️</div>
    <span class="nav-brand-name">刷题助手</span>
  </div>
  <div class="nav-tabs">
    <button type="button" class="nav-item active" data-page="practice">章节练习</button>
    <button type="button" class="nav-item" data-page="exam-config">模拟考试</button>
    <button type="button" class="nav-item" data-page="errors">错题集</button>
    <button type="button" class="nav-item" data-page="bookmarks">收藏集</button>
    <button type="button" class="nav-item" data-page="search">搜索</button>
    <button type="button" class="nav-item" data-page="manage">题库管理</button>
  </div>
  <button type="button" class="theme-toggle-btn" id="themeToggleBtn" title="切换主题" aria-label="切换主题">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
    </svg>
  </button>
</nav>

<!-- 内容区 -->
<div class="container" id="container"></div>

<script src="./data/default-questions.js"></script>
<script src="./app.js"></script>
<script>
  (function() {
    var gate = document.getElementById('accessGate');
    var form = document.getElementById('accessGateForm');
    var password = document.getElementById('accessPassword');
    var error = document.getElementById('accessGateError');

    if (!document.documentElement.classList.contains('access-locked')) {
      gate.hidden = true;
      return;
    }

    form.addEventListener('submit', function(event) {
      event.preventDefault();
      if (password.value === '23014104') {
        localStorage.setItem('quiz_access', 'true');
        document.documentElement.classList.remove('access-locked');
        gate.hidden = true;
      } else {
        error.textContent = '口令不正确，请重新输入。';
        password.select();
      }
    });
    password.focus();
  })();
</script>
</body>
</html>
