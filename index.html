<!DOCTYPE html>
<html lang="zh-CN">
<head>
<script>
  if (localStorage.getItem('quiz_access') !== 'v2') {
    document.documentElement.classList.add('access-locked');
  }
</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="刷题助手">
<meta name="theme-color" content="#f8fafc">
<meta name="format-detection" content="telephone=no">
<link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><rect width='180' height='180' rx='36' fill='%234f46e5'/><text x='90' y='115' font-size='100' fill='white' text-anchor='middle' font-family='sans-serif'>📝</text></svg>">
<link rel="manifest" id="manifestLink">
<title>刷题助手</title>
<script src="https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/localforage@1.10.0/dist/localforage.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,400,0,0&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./styles.css">
<link rel="stylesheet" href="./stitch-ui.css">
</head>
<body>

<div class="access-gate" id="accessGate" role="dialog" aria-modal="true" aria-labelledby="accessGateTitle">
  <form class="access-gate-card" id="accessGateForm">
    <div class="access-gate-mark" aria-hidden="true"><span class="material-symbols-outlined">lock_person</span></div>
    <h1 id="accessGateTitle">刷题助手</h1>
    <p>请输入访问口令以继续</p>
    <label class="sr-only" for="accessPassword">访问口令</label>
    <div class="access-password-field">
      <span class="material-symbols-outlined" aria-hidden="true">key</span>
      <input class="input" id="accessPassword" type="password" autocomplete="current-password" placeholder="请输入口令" required>
      <button type="button" class="icon-button access-password-toggle" id="accessPasswordToggle" aria-label="显示口令"><span class="material-symbols-outlined">visibility</span></button>
    </div>
    <div class="access-gate-options">
      <label><input id="rememberAccess" type="checkbox" checked> 记住本设备</label>
      <button type="button" class="text-button">获取帮助？</button>
    </div>
    <div class="access-gate-error" id="accessGateError" role="alert" aria-live="polite"></div>
    <button class="btn btn-primary access-submit" type="submit">进入刷题 <span class="material-symbols-outlined">arrow_forward</span></button>
    <div class="access-gate-footnote">安全访问 · 数据仅保存在当前设备</div>
  </form>
</div>

<div class="app-shell" id="appShell">
  <aside class="sidebar" id="navBar">
    <div class="sidebar-brand">
      <span class="sidebar-brand-mark material-symbols-outlined">school</span>
      <div><strong>刷题助手</strong><span>Study Assistant</span></div>
    </div>
    <nav class="sidebar-nav" aria-label="主导航">
      <button type="button" class="nav-item active" data-page="today"><span class="material-symbols-outlined">today</span><span>今日学习</span></button>
      <button type="button" class="nav-item" data-page="practice"><span class="material-symbols-outlined">dashboard</span><span>章节练习</span></button>
      <button type="button" class="nav-item" data-page="exam-config"><span class="material-symbols-outlined">assignment</span><span>模拟考试</span></button>
      <button type="button" class="nav-item" data-page="analysis"><span class="material-symbols-outlined">monitoring</span><span>学习分析</span></button>
      <button type="button" class="nav-item" data-page="errors"><span class="material-symbols-outlined">error</span><span>错题集</span></button>
      <button type="button" class="nav-item" data-page="bookmarks"><span class="material-symbols-outlined">grade</span><span>收藏集</span></button>
      <button type="button" class="nav-item" data-page="search"><span class="material-symbols-outlined">search</span><span>题目搜索</span></button>
      <button type="button" class="nav-item" data-page="manage"><span class="material-symbols-outlined">settings</span><span>题库管理</span></button>
    </nav>
    <div class="sidebar-bottom">
      <button type="button" class="sidebar-cta" data-page="today"><span class="material-symbols-outlined">play_arrow</span> 开始今日学习</button>
      <button type="button" class="sidebar-link"><span class="material-symbols-outlined">help</span> 使用帮助</button>
      <button type="button" class="sidebar-link" id="lockApplication"><span class="material-symbols-outlined">logout</span> 锁定应用</button>
    </div>
  </aside>

  <main class="app-main">
    <header class="topbar" id="topBar">
      <button type="button" class="mobile-menu-button icon-button" id="mobileMenuButton" aria-label="打开导航"><span class="material-symbols-outlined">menu</span></button>
      <button type="button" class="top-search" data-page="search"><span class="material-symbols-outlined">search</span><span>搜索题目、章节或解析...</span></button>
      <div class="topbar-actions">
        <span class="local-status"><i></i> 本地已保存</span>
        <button type="button" class="icon-button" aria-label="通知"><span class="material-symbols-outlined">notifications</span></button>
        <button type="button" class="icon-button theme-toggle-btn" id="themeToggleBtn" title="切换主题" aria-label="切换主题"><span class="material-symbols-outlined">dark_mode</span></button>
        <div class="topbar-avatar" aria-hidden="true"><span class="material-symbols-outlined">person</span></div>
      </div>
    </header>
    <div class="container app-container" id="container"></div>
  </main>

  <nav class="mobile-nav" id="mobileNav" aria-label="移动端导航">
    <button type="button" class="nav-item active" data-page="today"><span class="material-symbols-outlined">today</span><span>今日</span></button>
    <button type="button" class="nav-item" data-page="practice"><span class="material-symbols-outlined">dashboard</span><span>练习</span></button>
    <button type="button" class="nav-item" data-page="exam-config"><span class="material-symbols-outlined">assignment</span><span>考试</span></button>
    <button type="button" class="nav-item" data-page="analysis"><span class="material-symbols-outlined">monitoring</span><span>分析</span></button>
    <button type="button" class="nav-item" data-page="errors"><span class="material-symbols-outlined">error</span><span>错题</span></button>
  </nav>
  <button class="sidebar-scrim" id="sidebarScrim" type="button" aria-label="关闭导航"></button>
</div>

<script src="./data/default-questions.js"></script>
<script src="./study-engine.js"></script>
<script src="./app.js"></script>
<script>
  (function() {
    var gate = document.getElementById('accessGate');
    var form = document.getElementById('accessGateForm');
    var password = document.getElementById('accessPassword');
    var error = document.getElementById('accessGateError');
    var remember = document.getElementById('rememberAccess');
    var passwordToggle = document.getElementById('accessPasswordToggle');

    if (!document.documentElement.classList.contains('access-locked')) {
      gate.hidden = true;
      return;
    }

    var accessCodeDigest = '7e58a93ca49dfa364e6d817d0d3b1d4164035b10c90986df38e7d12127e9004e';

    form.addEventListener('submit', async function(event) {
      event.preventDefault();
      var inputBytes = new TextEncoder().encode(password.value);
      var digestBuffer = await crypto.subtle.digest('SHA-256', inputBytes);
      var inputDigest = Array.from(new Uint8Array(digestBuffer), function(byte) {
        return byte.toString(16).padStart(2, '0');
      }).join('');

      if (inputDigest === accessCodeDigest) {
        if (remember.checked) localStorage.setItem('quiz_access', 'v2');
        document.documentElement.classList.remove('access-locked');
        gate.hidden = true;
      } else {
        error.textContent = '口令不正确，请重新输入。';
        password.select();
      }
    });
    passwordToggle.addEventListener('click', function() {
      var show = password.type === 'password';
      password.type = show ? 'text' : 'password';
      passwordToggle.setAttribute('aria-label', show ? '隐藏口令' : '显示口令');
      passwordToggle.querySelector('.material-symbols-outlined').textContent = show ? 'visibility_off' : 'visibility';
      password.focus();
    });
    password.focus();
  })();
</script>
</body>
</html>
